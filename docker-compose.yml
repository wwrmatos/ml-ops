services:
  treino:
    build: .
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
    command: churn-train

  app:
    build: .
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
    ports:
      - "8501:8501"
    command: python -m streamlit run src/churn/app.py --server.address 0.0.0.0
